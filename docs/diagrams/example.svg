  <rect class="chp" x="366" y="427" width="44" height="18" rx="9"/><text class="ch" x="388" y="439.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="420" y="440.5">Try it:</text>
  <text class="msg mono" x="458" y="440.5">ewa-12.qa.example-webapp.sdlc.internal</text>
  <circle class="n-sys" cx="868" cy="436" r="7"/>
  <rect class="c-human" x="884" y="424" width="104" height="24" rx="12"/><text class="cst" x="936" y="440" text-anchor="middle">Code review</text>
  <text class="eff" x="1000" y="440">code in PR #34, preview up</text>

  <circle class="av-en" cx="58" cy="483" r="14"/><text class="av" x="58" y="487" text-anchor="middle">EN</text>
  <rect class="b-en" x="82" y="466" width="378" height="34" rx="12"/>
  <rect class="chp" x="92" y="474" width="44" height="18" rx="9"/><text class="ch" x="114" y="486.5" text-anchor="middle">GITEA</text>
  <text class="msg-m" x="146" y="487.5">@agent</text>
  <text class="msg" x="196" y="487.5">add an empty state when nothing matches</text>
  <circle class="n-agent" cx="868" cy="483" r="7"/>
  <rect class="c-agent" x="884" y="471" width="104" height="24" rx="12"/><text class="cst" x="936" y="487" text-anchor="middle">Implementing</text>
  <text class="eff" x="1000" y="487">changes:</text>
  <text class="ok" x="1056" y="487">engineer may ✓</text>

  <circle class="av-ag" cx="790" cy="530" r="14"/><text class="av" x="790" y="534" text-anchor="middle">@</text>
  <rect class="b-a" x="574" y="513" width="192" height="34" rx="12"/>
  <rect class="chp" x="584" y="521" width="44" height="18" rx="9"/><text class="ch" x="606" y="533.5" text-anchor="middle">GITEA</text>
  <text class="msg" x="638" y="534.5">Implementing a fix</text>
  <circle class="n-agent" cx="868" cy="530" r="7"/>
  <text class="eff" x="884" y="534">a Job pushes the fix</text>

  <circle class="av-ag" cx="790" cy="577" r="14"/><text class="av" x="790" y="581" text-anchor="middle">@</text>
  <rect class="b-a" x="248" y="560" width="518" height="34" rx="12"/>
  <rect class="chp" x="258" y="568" width="44" height="18" rx="9"/><text class="ch" x="280" y="580.5" text-anchor="middle">GITEA</text>
  <text class="msg" x="312" y="581.5">Fix is ready, have a look:</text>
  <text class="msg mono" x="458" y="581.5">ewa-12.qa.example-webapp.sdlc.internal</text>
  <circle class="n-sys" cx="868" cy="577" r="7"/>
  <rect class="c-human" x="884" y="565" width="104" height="24" rx="12"/><text class="cst" x="936" y="581" text-anchor="middle">Code review</text>
  <text class="eff" x="1000" y="581">preview updated</text>

  <circle class="av-en" cx="58" cy="624" r="14"/><text class="av" x="58" y="628" text-anchor="middle">EN</text>
  <rect class="b-en" x="82" y="607" width="256" height="34" rx="12"/>
  <rect class="chp" x="92" y="615" width="44" height="18" rx="9"/><text class="ch" x="114" y="627.5" text-anchor="middle">GITEA</text>
  <text class="msg-m" x="146" y="628.5">@agent</text>
  <text class="msg" x="196" y="628.5">ok, merge it into dev</text>
  <path class="gate" d="M868,614 L878,624 L868,634 L858,624 Z"/>
  <rect class="c-sys" x="884" y="612" width="104" height="24" rx="12"/><text class="cst" x="936" y="628" text-anchor="middle">On dev</text>
  <text class="eff" x="1000" y="628">merge:</text>
  <text class="ok" x="1045" y="628">engineer may ✓</text>

  <circle class="av-po" cx="58" cy="700" r="14"/><text class="av" x="58" y="704" text-anchor="middle">PO</text>
  <rect class="b-po" x="82" y="683" width="310" height="34" rx="12"/>
  <rect class="chp" x="92" y="691" width="86" height="18" rx="9"/><text class="ch" x="135" y="703.5" text-anchor="middle">MATTERMOST</text>
  <text class="msg-m" x="188" y="704.5">@agent</text>
  <text class="msg" x="238" y="704.5">let's prepare a release</text>
  <circle class="n-agent" cx="868" cy="700" r="7"/>
  <text class="eff" x="884" y="704">prepare_release:</text>
  <text class="ok" x="982" y="704">PO may ✓</text>

  <circle class="av-ag" cx="790" cy="747" r="14"/><text class="av" x="790" y="751" text-anchor="middle">@</text>
  <rect class="b-a" x="470" y="730" width="296" height="34" rx="12"/>
  <rect class="chp" x="480" y="738" width="86" height="18" rx="9"/><text class="ch" x="523" y="750.5" text-anchor="middle">MATTERMOST</text>
  <text class="msg" x="576" y="751.5">Release 1.6.0 is ready: PR #35</text>
  <circle class="n-wait" cx="868" cy="747" r="6"/>
  <text class="eff" x="884" y="751">PR #35 → main, notes: EWA-9, EWA-12</text>

  <circle class="av-en" cx="58" cy="794" r="14"/><text class="av" x="58" y="798" text-anchor="middle">EN</text>
  <rect class="b-act" x="82" y="777" width="294" height="34" rx="12"/>
  <rect class="chp" x="92" y="785" width="44" height="18" rx="9"/><text class="ch" x="114" y="797.5" text-anchor="middle">GITEA</text>
  <text class="act" x="146" y="798.5">approves and merges PR #35 by hand</text>
  <path class="gate" d="M868,784 L878,794 L868,804 L858,794 Z"/>
  <rect class="c-sys" x="884" y="782" width="104" height="24" rx="12"/><text class="cst" x="936" y="798" text-anchor="middle">Released</text>
  <text class="eff" x="1000" y="798">v1.6.0 tagged, prod updated</text>

  <!-- rules -->
  <rect class="panel" x="24" y="832" width="1192" height="66" rx="14"/>
  <text class="kick" x="44" y="857">THE RULES BEHIND IT</text>
  <text class="txt" x="44" y="880">@agent reads only what mentions it and answers where it was asked · a model reads the intent, code checks who may do what · only people merge into main</text>
</svg>
