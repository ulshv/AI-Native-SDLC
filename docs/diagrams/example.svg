  <circle class="n-agent" cx="868" cy="266" r="7"/>
  <rect class="c-agent" x="884" y="254" width="104" height="24" rx="12"/><text class="cst" x="936" y="270" text-anchor="middle">Drafting</text>
  <text class="eff" x="1000" y="270">a Job writes the spec</text>

  <circle class="av-ag" cx="790" cy="313" r="14"/><text class="av" x="790" y="317" text-anchor="middle">@</text>
  <rect class="b-a" x="448" y="296" width="318" height="34" rx="12"/>
  <rect class="chp" x="458" y="304" width="44" height="18" rx="9"/><text class="ch" x="480" y="316.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="512" y="317.5">The spec is ready: PR #34, please review</text>
