  <rect class="chp" x="92" y="351" width="44" height="18" rx="9"/><text class="ch" x="114" y="363.5" text-anchor="middle">PLANE</text>
  <text class="msg-m" x="146" y="364.5">@agent</text>
  <text class="msg" x="196" y="364.5">looks good, go ahead</text>
