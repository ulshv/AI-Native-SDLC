<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1240 920" width="1240" height="920" role="img" aria-labelledby="title desc">
  <title id="title">How it works, by example</title>
  <desc id="desc">One ticket, EWA-12, from request to release, as a conversation. Any message can come from Plane, Mattermost or a Gitea comment. The product owner files the ticket in Plane and assigns it to @agent. The agent asks whether the filter should survive a reload and waits; the product owner answers. The agent opens PR 34 with the spec; the product owner approves with a comment, and the policy checks that a product owner may approve. The agent posts a preview link. The engineer asks in a Gitea review for an empty state; the agent says it is implementing a fix, then posts the updated preview. The engineer tells the agent to merge into development. In the chat, the product owner asks for a release; the agent opens release PR 35. The engineer approves and merges it, CI tags v1.6.0 and production updates.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 14px; fill: #64748b; }
    .phase { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #94a3b8; }
    .msg { font-size: 12.5px; fill: #0f172a; }
    .msg-m { font-size: 12px; font-weight: 600; fill: #6d28d9; }
    .act { font-size: 12.5px; font-style: italic; fill: #475569; }
