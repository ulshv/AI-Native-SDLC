  <rect class="band" x="24" y="104" width="800" height="714" rx="14"/>
  <rect class="band" x="836" y="104" width="380" height="714" rx="14"/>
  <text class="phase" x="44" y="130">WHO SAYS WHAT, AND WHERE</text>
  <text class="eff" x="398" y="130">any message works from</text>
  <rect class="chp" x="540" y="117" width="44" height="18" rx="9"/><text class="ch" x="562" y="129.5" text-anchor="middle">PLANE</text>
  <rect class="chp" x="590" y="117" width="86" height="18" rx="9"/><text class="ch" x="633" y="129.5" text-anchor="middle">MATTERMOST</text>
  <rect class="chp" x="682" y="117" width="122" height="18" rx="9"/><text class="ch" x="743" y="129.5" text-anchor="middle">GITEA COMMENT</text>
  <text class="phase" x="856" y="130">WHAT HAPPENS</text>

  <line class="sep" x1="44" y1="398" x2="804" y2="398"/>
  <line class="sep" x1="44" y1="662" x2="804" y2="662"/>

