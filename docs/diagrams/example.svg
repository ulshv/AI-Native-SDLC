    <circle class="av-en" cx="118" cy="0" r="9"/><text class="lg" x="133" y="4">Engineer</text>
    <circle class="av-ag" cx="208" cy="0" r="9"/><text class="lg" x="223" y="4">@agent</text>
    <path class="gate" d="M286,-8 L294,0 L286,8 L278,0 Z"/><text class="lg" x="301" y="4">Gate</text>
  </g>

