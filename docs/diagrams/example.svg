  </style>

  <rect class="bg" x="0.5" y="0.5" width="1239" height="919" rx="18"/>

  <!-- header -->
  <text class="h1" x="40" y="56">How it works, by example</text>
  <text class="h2" x="40" y="82">EWA-12, "filter orders by status": people talk to @agent in their usual tools, and it does the work in between</text>
