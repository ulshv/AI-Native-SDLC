    .panel { fill: #faf5ff; stroke: #ddd6fe; }
    .chp { fill: #ffffff; stroke: #cbd5e1; }
    .b-po { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; }
    .b-en { fill: #ecfeff; stroke: #67e8f9; stroke-width: 1.2; }
