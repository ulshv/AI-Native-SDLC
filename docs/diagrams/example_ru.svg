  <rect class="chp" x="590" y="117" width="86" height="18" rx="9"/><text class="ch" x="633" y="129.5" text-anchor="middle">MATTERMOST</text>
  <rect class="chp" x="682" y="117" width="122" height="18" rx="9"/><text class="ch" x="743" y="129.5" text-anchor="middle">КОММЕНТ В GITEA</text>
  <text class="phase" x="856" y="130">ЧТО ПРОИСХОДИТ</text>

  <line class="sep" x1="44" y1="398" x2="804" y2="398"/>
  <line class="sep" x1="44" y1="662" x2="804" y2="662"/>

  <!-- timeline -->
  <line class="tl" x1="868" y1="170" x2="868" y2="794"/>

  <circle class="av-po" cx="58" cy="172" r="14"/><text class="av" x="58" y="176" text-anchor="middle">PO</text>
  <rect class="b-po" x="82" y="155" width="523" height="34" rx="12"/>
  <rect class="chp" x="92" y="163" width="44" height="18" rx="9"/><text class="ch" x="114" y="175.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="146" y="176.5">Новый тикет EWA-12: фильтр заказов по статусу ·</text>
  <text class="msg-m" x="453" y="176.5">исполнитель: @agent</text>
  <circle class="n-agent" cx="868" cy="172" r="7"/>
  <rect class="c-agent" x="884" y="160" width="104" height="24" rx="12"/><text class="cst" x="936" y="176" text-anchor="middle">Drafting</text>
  <text class="eff" x="1000" y="176">агент берёт задачу</text>

  <circle class="av-ag" cx="790" cy="219" r="14"/><text class="av" x="790" y="223" text-anchor="middle">@</text>
  <rect class="b-a" x="359" y="202" width="407" height="34" rx="12"/>
  <rect class="chp" x="369" y="210" width="44" height="18" rx="9"/><text class="ch" x="391" y="222.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="423" y="223.5">Фильтр должен переживать перезагрузку страницы?</text>
  <circle class="n-wait" cx="868" cy="219" r="6"/>
  <rect class="c-human" x="884" y="207" width="104" height="24" rx="12"/><text class="cst" x="936" y="223" text-anchor="middle">Needs info</text>
  <text class="eff" x="1000" y="223">останавливается и ждёт</text>

  <circle class="av-po" cx="58" cy="266" r="14"/><text class="av" x="58" y="270" text-anchor="middle">PO</text>
  <rect class="b-po" x="82" y="249" width="282" height="34" rx="12"/>
  <rect class="chp" x="92" y="257" width="44" height="18" rx="9"/><text class="ch" x="114" y="269.5" text-anchor="middle">PLANE</text>
  <text class="msg-m" x="146" y="270.5">@agent</text>
  <text class="msg" x="199" y="270.5">нет, пусть сбрасывается</text>
  <circle class="n-agent" cx="868" cy="266" r="7"/>
  <rect class="c-agent" x="884" y="254" width="104" height="24" rx="12"/><text class="cst" x="936" y="270" text-anchor="middle">Drafting</text>
  <text class="eff" x="1000" y="270">Job пишет спеку</text>

  <circle class="av-ag" cx="790" cy="313" r="14"/><text class="av" x="790" y="317" text-anchor="middle">@</text>
  <rect class="b-a" x="485" y="296" width="281" height="34" rx="12"/>
  <rect class="chp" x="495" y="304" width="44" height="18" rx="9"/><text class="ch" x="517" y="316.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="549" y="317.5">Спека готова: PR #34, жду ревью</text>
  <circle class="n-wait" cx="868" cy="313" r="6"/>
  <rect class="c-human" x="884" y="301" width="104" height="24" rx="12"/><text class="cst" x="936" y="317" text-anchor="middle">Spec review</text>
  <text class="eff" x="1000" y="317">PR #34, пока только спека</text>

  <circle class="av-po" cx="58" cy="360" r="14"/><text class="av" x="58" y="364" text-anchor="middle">PO</text>
  <rect class="b-po" x="82" y="343" width="300" height="34" rx="12"/>
  <rect class="chp" x="92" y="351" width="44" height="18" rx="9"/><text class="ch" x="114" y="363.5" text-anchor="middle">PLANE</text>
  <text class="msg-m" x="146" y="364.5">@agent</text>
  <text class="msg" x="199" y="364.5">выглядит хорошо, поехали</text>
  <path class="gate" d="M868,350 L878,360 L868,370 L858,360 Z"/>
  <rect class="c-agent" x="884" y="348" width="104" height="24" rx="12"/><text class="cst" x="936" y="364" text-anchor="middle">Implementing</text>
  <text class="eff" x="1000" y="364">approve:</text>
  <text class="ok" x="1053" y="364">PO может апрувить ✓</text>

  <circle class="av-ag" cx="790" cy="436" r="14"/><text class="av" x="790" y="440" text-anchor="middle">@</text>
  <rect class="b-a" x="309" y="419" width="457" height="34" rx="12"/>
  <rect class="chp" x="319" y="427" width="44" height="18" rx="9"/><text class="ch" x="341" y="439.5" text-anchor="middle">PLANE</text>
  <text class="msg" x="373" y="440.5">Попробуйте:</text>
  <text class="msg mono" x="458" y="440.5">ewa-12.qa.example-webapp.sdlc.internal</text>
  <circle class="n-sys" cx="868" cy="436" r="7"/>
  <rect class="c-human" x="884" y="424" width="104" height="24" rx="12"/><text class="cst" x="936" y="440" text-anchor="middle">Code review</text>
  <text class="eff" x="1000" y="440">код в PR #34, превью есть</text>

  <circle class="av-en" cx="58" cy="483" r="14"/><text class="av" x="58" y="487" text-anchor="middle">ИН</text>
  <rect class="b-en" x="82" y="466" width="451" height="34" rx="12"/>
  <rect class="chp" x="92" y="474" width="44" height="18" rx="9"/><text class="ch" x="114" y="486.5" text-anchor="middle">GITEA</text>
  <text class="msg-m" x="146" y="487.5">@agent</text>
  <text class="msg" x="199" y="487.5">добавь пустое состояние, когда ничего не нашлось</text>
  <circle class="n-agent" cx="868" cy="483" r="7"/>
