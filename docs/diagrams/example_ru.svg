  <text class="eff" x="1000" y="487">changes:</text>
  <text class="ok" x="1056" y="487">инженер может ✓</text>

  <circle class="av-ag" cx="790" cy="530" r="14"/><text class="av" x="790" y="534" text-anchor="middle">@</text>
  <rect class="b-a" x="612" y="513" width="154" height="34" rx="12"/>
  <rect class="chp" x="622" y="521" width="44" height="18" rx="9"/><text class="ch" x="644" y="533.5" text-anchor="middle">GITEA</text>
