  <rect class="c-sys" x="884" y="612" width="104" height="24" rx="12"/><text class="cst" x="936" y="628" text-anchor="middle">On dev</text>
  <text class="eff" x="1000" y="628">merge:</text>
  <text class="ok" x="1045" y="628">инженер может ✓</text>

  <circle class="av-po" cx="58" cy="700" r="14"/><text class="av" x="58" y="704" text-anchor="middle">PO</text>
  <rect class="b-po" x="82" y="683" width="310" height="34" rx="12"/>
  <rect class="chp" x="92" y="691" width="86" height="18" rx="9"/><text class="ch" x="135" y="703.5" text-anchor="middle">MATTERMOST</text>
  <text class="msg-m" x="188" y="704.5">@agent</text>
  <text class="msg" x="241" y="704.5">давай готовить релиз</text>
  <circle class="n-agent" cx="868" cy="700" r="7"/>
  <text class="eff" x="884" y="704">prepare_release:</text>
  <text class="ok" x="982" y="704">PO может ✓</text>

  <circle class="av-ag" cx="790" cy="747" r="14"/><text class="av" x="790" y="751" text-anchor="middle">@</text>
  <rect class="b-a" x="491" y="730" width="275" height="34" rx="12"/>
  <rect class="chp" x="501" y="738" width="86" height="18" rx="9"/><text class="ch" x="544" y="750.5" text-anchor="middle">MATTERMOST</text>
  <text class="msg" x="597" y="751.5">Релиз 1.6.0 готов: PR #35</text>
  <circle class="n-wait" cx="868" cy="747" r="6"/>
  <text class="eff" x="884" y="751">PR #35 → main, заметки: EWA-9, EWA-12</text>

  <circle class="av-en" cx="58" cy="794" r="14"/><text class="av" x="58" y="798" text-anchor="middle">ИН</text>
  <rect class="b-act" x="82" y="777" width="286" height="34" rx="12"/>
  <rect class="chp" x="92" y="785" width="44" height="18" rx="9"/><text class="ch" x="114" y="797.5" text-anchor="middle">GITEA</text>
  <text class="act" x="146" y="798.5">апрувит и мёржит PR #35 руками</text>
  <path class="gate" d="M868,784 L878,794 L868,804 L858,794 Z"/>
  <rect class="c-sys" x="884" y="782" width="104" height="24" rx="12"/><text class="cst" x="936" y="798" text-anchor="middle">Released</text>
  <text class="eff" x="1000" y="798">тег v1.6.0, прод обновлён</text>

  <!-- rules -->
  <rect class="panel" x="24" y="832" width="1192" height="66" rx="14"/>
  <text class="kick" x="44" y="857">ПРАВИЛА ЗА ЭТИМ</text>
  <text class="txt" x="44" y="880">@agent читает только то, где его упомянули, и отвечает там же · модель понимает намерение, код проверяет, кто что может · в main мёржат только люди</text>
</svg>
