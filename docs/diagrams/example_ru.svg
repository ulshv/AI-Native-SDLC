  <rect class="b-a" x="253" y="560" width="513" height="34" rx="12"/>
  <rect class="chp" x="263" y="568" width="44" height="18" rx="9"/><text class="ch" x="285" y="580.5" text-anchor="middle">GITEA</text>
  <text class="msg" x="317" y="581.5">Фикс готов, смотрите:</text>
  <text class="msg mono" x="458" y="581.5">ewa-12.qa.example-webapp.sdlc.internal</text>
