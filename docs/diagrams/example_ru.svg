  <rect class="c-human" x="884" y="565" width="104" height="24" rx="12"/><text class="cst" x="936" y="581" text-anchor="middle">Code review</text>
  <text class="eff" x="1000" y="581">превью обновлено</text>

  <circle class="av-en" cx="58" cy="624" r="14"/><text class="av" x="58" y="628" text-anchor="middle">ИН</text>
