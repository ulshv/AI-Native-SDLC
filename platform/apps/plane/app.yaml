apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: plane
  sources:
    - repoURL: https://helm.plane.so
      chart: plane-ce
      targetRevision: 1.8.6
      helm:
        releaseName: plane
        valueFiles:
          - $values/platform/apps/plane/values.yaml
    - repoURL: http://gitea-http.gitea.svc:3000/sdlc/ai-native-sdlc.git
      targetRevision: main
      ref: values
