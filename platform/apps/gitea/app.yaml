apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  sources:
    - repoURL: https://dl.gitea.com/charts
      chart: gitea
      targetRevision: 12.7.0
      helm:
        releaseName: gitea
        valueFiles:
          - $values/platform/apps/gitea/values.yaml
    - repoURL: http://gitea-http.gitea.svc:3000/sdlc/ai-native-sdlc.git
      targetRevision: main
      ref: values
