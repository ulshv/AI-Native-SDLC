# cert-manager issues the *.sdlc.internal certificate from the local root CA; the issuer and
# the certificate are in platform/apps/traefik/.
crds:
  enabled: true
# A post-install check that Argo CD would run as a hook on every sync.
startupapicheck:
  enabled: false
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
