# The target projects' environments (design decision 11): the ApplicationSets next to this file.
# A directory source does not recurse, so the chart in ./project is left to projects.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: environments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/ai-native-sdlc.git
    targetRevision: main
    path: platform/apps/environments
    directory:
      exclude: app.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
