# Set per project by the ApplicationSet in ../projects.yaml, from its project.yaml.
name: ""        # the project's name
repository: ""  # its Gitea repository, owner/name
domain: ""      # production's host; dev is dev.<domain>, a preview <id>.qa.<domain>
previews: false
# Pods per environment namespace: a chart that asks for hundreds cannot fill the node.
maxPods: 10
