# What the project's own chart may deploy. The chart lives in the product's repository, which
# agents write to, and a preview runs a branch no person has reviewed, so it is not trusted as the
# platform's files are: it may come only from that repository, go only into this project's
# environment namespaces, hold nothing cluster-wide, and only the kinds below. Left out on
# purpose: NetworkPolicy (one of its own would open what the platform's closes), RBAC, quotas,
# Traefik's IngressRoutes and Gateway routes (hosts that ../ingress-hosts.yaml does not see), and
# cert-manager's resources (a certificate for any name the local CA signs).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ required "name is required" .Values.name }}
  namespace: argocd
spec:
  description: {{ .Values.name }}'s environments, from the chart in its own repository
  sourceRepos:
    - http://gitea-http.gitea.svc:3000/{{ required "repository is required" .Values.repository }}.git
  destinations:
  {{- range include "project.environments" . | fromYamlArray }}
    - server: https://kubernetes.default.svc
      namespace: {{ $.Values.name }}-{{ .env }}
  {{- end }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Secret}
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: batch, kind: Job}
    - {group: batch, kind: CronJob}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: Ingress}
