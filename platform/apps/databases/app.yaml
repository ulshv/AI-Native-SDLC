apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  source:
    repoURL: http://gitea-http.gitea.svc:3000/sdlc/ai-native-sdlc.git
    targetRevision: main
    path: platform/apps/databases
    directory:
      exclude: app.yaml
