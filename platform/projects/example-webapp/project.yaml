# example-webapp in the delivery loop (design decision 10). One file per target project, read by
# Plane's setup Job (platform/apps/plane), and later by the orchestrator and Argo CD's
# ApplicationSets. The repository, branches, domain and previews come with task 5.6.
name: example-webapp

# The Plane project the loop takes tickets from.
tracker:
  workspace: sdlc
  identifier: EWA
  name: Example webapp   # Plane allows no special characters in a project name

# People and their roles in the loop (design decision 5): product_owner, engineer. Usernames
# only, never e-mail addresses: this repository is public. Plane's `admin` and Gitea's
# `gitea_admin` are the instance admins the bootstrap creates.
people:
  - name: sergey
    roles: [product_owner, engineer]
    plane: admin
    gitea: gitea_admin
