# App-of-apps: renders one child Application per platform/apps/<component>/app.yaml, and
# this file too, so a change to the root itself also arrives through git. The bootstrap
# applies it once to start the loop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: http://gitea-http.gitea.svc:3000/sdlc/ai-native-sdlc.git
    targetRevision: main
    path: platform
    directory:
      recurse: true
      include: '{argocd/root.yaml,apps/*/app.yaml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
