# For the alembic CLI while developing, with DATABASE_URL set:
#   uv run alembic revision -m "add a column" --rev-id 0002
#   uv run alembic upgrade head
# The service migrates with `orchestrator migrate` (db.migrate), which needs no file.
[alembic]
script_location = %(here)s/src/orchestrator/migrations
file_template = %%(rev)s_%%(slug)s
