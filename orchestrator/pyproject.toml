[project]
name = "orchestrator"
version = "0.1.0"
description = "The delivery loop's orchestrator: webhooks into a queue, one LangGraph thread per work item, agent runs as Kubernetes Jobs."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "langchain-openai==1.7.4",
    "langchain-deepseek==1.1.1",
    "kubernetes==37.0.2",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "alembic==1.20.1",
    "sqlalchemy==2.1.8",
    "pydantic-settings[yaml]==2.16.2",
    "tenacity==9.2.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261103",
]

[project.scripts]
orchestrator = "orchestrator.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "SIM", "UP", "RUF"]

[tool.pyright]
# The same checker as Pylance in the editor, so what it marks CI fails on.
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# Partly typed libraries (LangGraph without stubs, the Kubernetes client's config and watch): their
# typing is theirs to fix; our own code's unknown variables and arguments stay errors.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
venvPath = "."
venv = ".venv"
